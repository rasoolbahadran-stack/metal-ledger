services:
  postgres:
    image: postgres:16-alpine
    container_name: metal-ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: metal_user
      POSTGRES_PASSWORD: metal_dev_password
      POSTGRES_DB: metal_ledger
    ports:
      - "5432:5432"
    volumes:
      - metal-ledger-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metal_user -d metal_ledger"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  metal-ledger-postgres:
